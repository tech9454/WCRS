<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --fg:#222; --muted:#6b7080; --line:#dcdfe8; --accent:#667eea; --field:#fff; }
  body.dark { --bg:#1a1a2e; --card:#16213e; --fg:#e8e8f0; --muted:#9aa0b8; --line:#2a2a4a; --accent:#7c8cf5; --field:#0f3460; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; }
  .page { max-width:760px; margin:0 auto; }
  h1 { color:var(--accent); margin:0 0 16px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--accent); }
  .f { margin-bottom:14px; } .f:last-child { margin-bottom:0; }
  .f > label, .f > .lbl { display:block; font-weight:600; font-size:14px; margin-bottom:4px; }
  .check { display:flex; gap:8px; align-items:center; font-weight:600; font-size:14px; }
  .warn-o { color:darkorange; font-weight:700; font-size:13.5px; margin-bottom:6px; }
  .hint { color:var(--muted); font-size:12.5px; margin-top:3px; }
  select, input[type=text], textarea { width:100%; box-sizing:border-box; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--field); color:var(--fg); font:inherit; }
  textarea { height:140px; font-family:Consolas,monospace; font-size:13px; }
  .inline { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .inline > div { flex:1; min-width:180px; }
  button { padding:8px 14px; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font:inherit; font-size:13px; font-weight:600; }
  button.sec2 { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  #toast { position:fixed; right:20px; bottom:20px; background:#2ed573; color:#fff; padding:8px 14px; border-radius:6px; font-weight:700; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  pre { background:var(--field); border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; font-size:12px; max-height:360px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div class="page">
  <h1 data-i18n="o_title"></h1>

  <section>
    <h2 data-i18n="o_appearance"></h2>
    <div class="inline">
      <div class="f"><label for="language" data-i18n="o_language"></label><select id="language"><option value="en">English</option><option value="ru">Русский</option></select></div>
      <div class="f"><label for="theme" data-i18n="o_theme"></label><select id="theme"></select></div>
      <div class="f"><label for="widgetPosition" data-i18n="o_position"></label><select id="widgetPosition"></select></div>
    </div>
    <div class="hint" data-i18n="o_position_h"></div>
  </section>

  <section>
    <h2 data-i18n="o_sites"></h2>
    <div class="f"><label for="streamHosts" data-i18n="o_streamHosts"></label><textarea id="streamHosts"></textarea><div class="hint" data-i18n="o_streamHosts_h"></div></div>
    <div class="f"><label for="archiveSites" data-i18n="o_archiveSites"></label><textarea id="archiveSites"></textarea><div class="hint" data-i18n="o_archiveSites_h"></div></div>
    <button class="sec2" id="resetSites" data-i18n="o_resetSites"></button>
  </section>

  <section>
    <h2 data-i18n="o_search"></h2>
    <div class="inline">
      <div class="f"><label for="requestDelay" data-i18n="o_requestDelay"></label><select id="requestDelay"></select><div class="hint" data-i18n="o_requestDelay_h"></div></div>
      <div class="f"><label for="cacheMinutes" data-i18n="o_cache"></label><select id="cacheMinutes"></select><div class="hint" data-i18n="o_cache_h"></div></div>
    </div>
    <div class="f"><label class="check"><input type="checkbox" id="strictMatch"><span data-i18n="o_strictMatch"></span></label><div class="hint" data-i18n="o_strictMatch_h"></div></div>
    <div class="f"><div class="warn-o" data-i18n="o_engine_warn"></div><label for="engine" data-i18n="o_engine"></label><select id="engine"></select><div class="hint" data-i18n="o_engine_h"></div></div>
  </section>

  <section>
    <h2 data-i18n="o_behavior"></h2>
    <div class="f"><label class="check"><input type="checkbox" id="detectAnyStream"><span data-i18n="o_detectAny"></span></label><div class="hint" data-i18n="o_detectAny_h"></div></div>
    <div class="f"><label class="check"><input type="checkbox" id="pauseOnFound"><span data-i18n="o_pause"></span></label><div class="hint" data-i18n="o_pause_h"></div></div>
    <div class="f"><label class="check"><input type="checkbox" id="autoScan"><span data-i18n="o_autoScan"></span></label><div class="hint" data-i18n="o_autoScan_h"></div></div>
    <div class="f"><label for="searchDelay" data-i18n="o_delay"></label><select id="searchDelay"></select><div class="hint" data-i18n="o_delay_h"></div></div>
  </section>

  <section>
    <h2 data-i18n="o_data"></h2>
    <button class="sec2" id="exportBtn" data-i18n="o_export"></button>
    <button class="sec2" id="importBtn" data-i18n="o_import"></button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </section>

  <section>
    <div class="f"><label class="check"><input type="checkbox" id="testMode"><span data-i18n="o_test"></span></label><div class="hint" data-i18n="o_test_h"></div></div>
    <div id="diagBox" style="display:none">
      <h2 data-i18n="o_diag"></h2>
      <div class="hint" data-i18n="o_diag_h" style="margin:0 0 10px"></div>
      <div class="inline">
        <div class="f"><label for="diagNick" data-i18n="o_diagNick"></label><input type="text" id="diagNick" placeholder="sweet_anna"></div>
        <div class="f"><label for="diagSite" data-i18n="o_diagSite"></label><select id="diagSite"></select></div>
        <div class="f"><button id="diagRun" data-i18n="o_run"></button></div>
      </div>
      <pre id="diagOut" style="display:none"></pre>
    </div>
  </section>
</div>
<div id="toast"></div>
<script src="shared.js"></script>
<script src="options.js"></script>
</body>
</html>
