<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
body.dark { background: #1a1a2e; color: #e0e0e0; }
h1 { color: #667eea; }
body.dark h1 { color: #7c8cf5; }
.option-group { margin-bottom: 20px; }
label { display: block; margin-bottom: 5px; font-weight: bold; }
input[type="text"], textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
body.dark input[type="text"], body.dark textarea, body.dark select { background: #16213e; color: #e0e0e0; border-color: #2a2a4a; }
textarea { height: 100px; }
button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #5568d3; }
#statusMsg { margin-left: 10px; color: #2ed573; }
.help { font-size: 12px; color: #666; margin-top: 5px; }
body.dark .help { color: #a0a0a0; }
</style>
</head>
<body>
<h1 data-en="Settings" data-ru="Настройки">Settings</h1>

<div class="option-group">
<label data-en="Appearance" data-ru="Внешний вид">Appearance</label>
<label data-en="Language" data-ru="Язык">Language</label>
<select id="languageSelect">
<option value="en">English</option>
<option value="ru">Русский</option>
</select>
<label data-en="Theme" data-ru="Тема">Theme</label>
<select id="themeSelect">
<option value="light">☀️ Light / Светлая</option>
<option value="dark">🌙 Dark / Тёмная</option>
</select>
</div>

<div class="option-group">
<label data-en="Sites" data-ru="Сайты">Sites</label>
<label data-en="Stream Hosts" data-ru="Хосты стримов">Stream Hosts</label>
<input type="text" id="streamHosts" placeholder="bongacams.com, chaturbate.com">
<div class="help" data-help-en="Comma-separated list of streaming sites to monitor" data-help-ru="Список стриминговых сайтов через запятую"></div>
<label data-en="Archive Sites" data-ru="Архивные сайты">Archive Sites</label>
<textarea id="archiveSites" placeholder="striptube.cc&#10;showcamrips.com"></textarea>
<div class="help" data-help-en="One archive site per line" data-help-ru="Один архивный сайт на строку"></div>
</div>

<div class="option-group">
<label data-en="Behavior" data-ru="Поведение">Behavior</label>
<label><input type="checkbox" id="detectAnyStream"> <span data-en="Detect any stream" data-ru="Определять любой стрим">Detect any stream</span></label>
<div class="help" data-help-en="Detect streams on sites not in the list by page content" data-help-ru="Определять стримы на сайтах не из списка по содержимому страницы"></div>
<label><input type="checkbox" id="pauseOnFound"> <span data-en="Pause on found" data-ru="Пауза при находке">Pause on found</span></label>
<div class="help" data-help-en="Pause search after first result found" data-help-ru="Остановить поиск после первой находки"></div>
<label><input type="checkbox" id="autoScan"> <span data-en="Auto-scan" data-ru="Автосканирование">Auto-scan</span></label>
<div class="help" data-help-en="Automatically start search when stream is detected" data-help-ru="Автоматически запускать поиск при обнаружении стрима"></div>

<label data-en="Search delay (auto-scan)" data-ru="Задержка поиска (автоскан)">Search delay (auto-scan)</label>
<select id="searchDelay">
<option value="1000">1 second / 1 секунда</option>
<option value="2000">2 seconds / 2 секунды</option>
<option value="3000" selected>3 seconds / 3 секунды</option>
</select>
<div class="help" data-help-en="Delay before starting auto-search after stream detection" data-help-ru="Задержка перед началом автопоиска после обнаружения стрима"></div>
</div>

<div class="option-group">
<label data-en="Position" data-ru="Позиция">Position</label>
<label data-en="Widget position" data-ru="Позиция виджета">Widget position</label>
<select id="widgetPosition">
<option value="top-left">↖️ Top Left / Сверху слева</option>
<option value="top-right">️ Top Right / Сверху справа</option>
<option value="bottom-left">↙️ Bottom Left / Снизу слева</option>
<option value="bottom-right">↘️ Bottom Right / Снизу справа</option>
</select>
<div class="help" data-help-en="Where the widget appears on the page" data-help-ru="Где виджет появляется на странице"></div>
</div>

<button id="saveBtn" data-en="Save" data-ru="Сохранить">Save</button>
<span id="statusMsg"></span>
<script src="options.js"></script>
</body>
</html>
