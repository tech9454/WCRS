<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#888; --card:#f4f5f7; --line:#e1e4e8; --accent:#667eea; }
  body.dark { --bg:#16213e; --fg:#e8e8f0; --muted:#9aa0b8; --card:#0f3460; --line:#2a2a4a; --accent:#7c8cf5; }
  body { width:260px; margin:0; padding:12px; background:var(--bg); color:var(--fg); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .title { font-size:14px; font-weight:600; } .version { font-size:11px; color:var(--muted); }
  .status { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--card); border-radius:6px; margin-bottom:12px; font-size:13px; font-weight:500; }
  .dot { width:8px; height:8px; border-radius:50%; background:#2ed573; } .dot.off { background:#ff4757; }
  .links { display:flex; gap:8px; margin-bottom:12px; }
  .links a { flex:1; text-align:center; padding:6px; border:1px solid var(--line); border-radius:6px; text-decoration:none; color:var(--fg); font-size:12px; font-weight:500; }
  .links a:hover { background:var(--card); }
  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:13px; }
  .switch { position:relative; width:36px; height:20px; display:inline-block; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#ccc; transition:.3s; border-radius:20px; cursor:pointer; }
  .slider:before { content:""; position:absolute; height:14px; width:14px; left:3px; bottom:3px; background:#fff; transition:.3s; border-radius:50%; }
  input:checked + .slider { background:var(--accent); } input:checked + .slider:before { transform:translateX(16px); }
  .footer { border-top:1px solid var(--line); padding-top:10px; text-align:center; }
  .footer a { font-size:12px; color:var(--accent); text-decoration:none; font-weight:500; } .footer a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="header"><div class="title">Web Cam Records Searcher</div><div class="version" id="ver"></div></div>
  <div class="status"><div class="dot" id="dot"></div><div id="statusText"></div></div>
  <div class="links">
    <a href="https://github.com/tech9454/WCRS" target="_blank" rel="noopener">GitHub</a>
    <a href="https://boosty.to/wcrs" target="_blank" rel="noopener">Boosty</a>
  </div>
  <div class="row"><span id="toggleLabel"></span><label class="switch"><input type="checkbox" id="toggle"><span class="slider"></span></label></div>
  <div class="footer"><a href="#" id="settingsLink"></a></div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
